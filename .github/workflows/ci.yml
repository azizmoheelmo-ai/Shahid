name: CI

# يشتغل تلقائيًا على كل push وكل Pull Request — يفحص صحة صياغة الكود
# ويشغّل اختبارات الوحدة. الواجهة نفسها (index.html + app/*.js) بلا أي
# اعتماديات npm؛ الاعتماديات المثبَّتة هنا لازمة فقط لموصل الذكاء الاصطناعي
# (api/mcp.js) واختباره (tests/mcp-connector.test.js).

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تثبيت الاعتماديات (لموصل الذكاء الاصطناعي فقط)
        run: npm ci

      - name: فحص صياغة JavaScript (index.html + sw.js)
        run: node scripts/check-syntax.js

      - name: تشغيل اختبارات الوحدة
        run: node --test tests/*.test.js
