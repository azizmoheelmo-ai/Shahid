name: CI

# يشتغل تلقائيًا على كل push وكل Pull Request — يفحص صحة صياغة الكود،
# ويشغّل اختبارات الوحدة، ثم اختبارات متصفح آلية (Playwright) لأهم 3 مسارات
# (دخول/إضافة شاهد/الشاشة الرئيسية) ضد بيئة staging (schema منفصلة بنفس
# مشروع Supabase — لا تلمس بيانات الإنتاج إطلاقًا، راجع app-01-core.js).
# الواجهة نفسها (index.html + app/*.js) بلا أي اعتماديات npm وقت التشغيل
# الحقيقي؛ الاعتماديات المثبَّتة هنا لازمة فقط لموصل الذكاء الاصطناعي
# (api/mcp.js) واختباره، ولـPlaywright (devDependency، لا تُنشر للإنتاج).

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تثبيت الاعتماديات (لموصل الذكاء الاصطناعي فقط)
        run: npm ci

      - name: فحص أمني للاعتماديات (npm audit — يفشل عند ثغرة عالية الخطورة فأعلى)
        run: npm audit --omit=dev --audit-level=high

      - name: فحص صياغة JavaScript (index.html + sw.js)
        run: node scripts/check-syntax.js

      - name: تشغيل اختبارات الوحدة
        run: node --test tests/*.test.js

      - name: تثبيت متصفح Chromium لـPlaywright
        run: npx playwright install --with-deps chromium

      - name: اختبارات المتصفح الآلية (دخول/إضافة شاهد/الشاشة الرئيسية — بيئة staging)
        run: npx playwright test

      - name: طباعة سياق DOM عند الفشل (لتشخيص عنصر غير مرئي بلا تحميل ملف ثنائي)
        if: failure()
        run: find test-results -name "error-context.md" -print -exec cat {} \;

      - name: رفع تقرير Playwright عند الفشل (للتشخيص)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
