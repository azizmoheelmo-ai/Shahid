<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار تصدير PDF</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  body{font-family:'Cairo',sans-serif;margin:0;padding:16px;background:#f3f1ea;color:#232323;}
  h1{font-size:18px;margin:0 0 6px;} p{font-size:13px;margin:0 0 14px;color:#555;}
  .case{background:#fff;border:1px solid #d8d2c4;padding:10px;margin-bottom:14px;}
  .case h2{font-size:14px;margin:0 0 8px;color:#1B3245;}
  .case img{width:100%;display:block;border:1px dashed #bbb;}
  #stage{position:fixed;top:0;left:-99999px;width:794px;background:#fff;}
  button{font-family:inherit;font-size:15px;padding:10px 18px;}
</style>
</head>
<body>
<h1>اختبار تصدير PDF (تشخيصي)</h1>
<p>اضغط الزر، ثم صوّر الشاشة وأرسلها. الطريقة التي تظهر حروفها متصلة وواضحة هي التي نعتمدها.</p>
<button id="go">ابدأ الاختبار</button>
<div id="out"></div>
<div id="stage"></div>
<script src="vendor/html2canvas.min.js"></script>
<script>
var TXT = 'أطلقتُ تحدّي الخطوات اليومية بين الفصول لزيادة النشاط البدني لدى الطلاب خارج الحصة مع متابعة أسبوعية.\nرفع مستوى النشاط لدى الطلاب.';
var BOX = 'font-size:11.5px;line-height:1.8;background:#F7F5F0;border:1px solid #D8D2C4;padding:8px 12px;';
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
var CASES = [
  { title: 'أ. الطريقة الحالية (pre-wrap)', html: '<div style="'+BOX+'white-space:pre-wrap;">'+esc(TXT)+'</div>', opts: {} },
  { title: 'ب. بدون pre-wrap (br)', html: '<div style="'+BOX+'">'+esc(TXT).replace(/\n/g,'<br>')+'</div>', opts: {} },
  { title: 'ج. foreignObjectRendering', html: '<div style="'+BOX+'">'+esc(TXT).replace(/\n/g,'<br>')+'</div>', opts: { foreignObjectRendering: true } },
  { title: 'د. حجم x1 بدل x2', html: '<div style="'+BOX+'">'+esc(TXT).replace(/\n/g,'<br>')+'</div>', opts: { scale: 1 } }
];
document.getElementById('go').onclick = async function(){
  var out = document.getElementById('out'), stage = document.getElementById('stage');
  out.innerHTML = '';
  try{ await document.fonts.load("400 12px 'Cairo'", TXT); } catch(e){}
  for(var i = 0; i < CASES.length; i++){
    var c = CASES[i], sec = document.createElement('div');
    sec.className = 'case'; sec.innerHTML = '<h2>'+c.title+'</h2>';
    out.appendChild(sec);
    stage.innerHTML = '<div dir="rtl" style="width:794px;font-family:\'Cairo\',sans-serif;background:#fff;">'+c.html+'</div>';
    await new Promise(function(r){ setTimeout(r, 100); });
    try{
      var cv = await html2canvas(stage, Object.assign({ scale: 2, backgroundColor: '#ffffff' }, c.opts));
      var img = new Image(); img.src = cv.toDataURL('image/png'); sec.appendChild(img);
    } catch(e){ sec.insertAdjacentHTML('beforeend', '<p>فشلت: '+esc(String(e && e.message || e))+'</p>'); }
  }
  var ref = document.createElement('div'); ref.className = 'case';
  ref.innerHTML = '<h2>هـ. النص الأصلي بلا تصدير (للمقارنة)</h2><div style="'+BOX+'white-space:pre-wrap;">'+esc(TXT)+'</div>';
  out.appendChild(ref);
};
</script>
</body>
</html>
